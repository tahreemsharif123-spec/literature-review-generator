# Netlify deploys the verilit folder as a static site on every push to main.
[build]
  publish = "verilit"

# Netlify cannot run PHP. Hide the PHP writer so the page falls back to "Copy prompt".
[[redirects]]
  from = "/api/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
